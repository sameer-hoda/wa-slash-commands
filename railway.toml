# Mosaic on Railway: ONE container, ONE volume.
#
# Process: the Go bridge (public setup page + /health on $PORT, internal
# token-gated send API on 127.0.0.1:8090). wacmd.py runs per /command and
# everything shares /data (STORE_DIR).
#
# Railway dashboard settings (NOT expressible in this file):
#   - Volume mounted at /data — REQUIRED, otherwise pairing, history and
#     /pending state are lost on every restart
#   - Variables: GEMINI_API_KEY (billing-enabled), TZ (default Asia/Kolkata),
#     optional SETUP_PASSWORD (otherwise generated + printed in deploy logs)
#   - PORT is provided by Railway automatically; keep numReplicas = 1
#     (two replicas would run two bots on one number)
#
# First boot: open the service URL → enter the setup password (deploy logs)
# → scan the WhatsApp QR → the page shows "Connected as +91… · Me chat: …".

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
