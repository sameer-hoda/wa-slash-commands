<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic setup</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: min(420px, calc(100vw - 32px)); padding: 28px;
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 18px; }
  .view { display: none; }
  .view.active { display: block; }
  .qr-wrap {
    background: #fff; border-radius: 8px; padding: 12px; text-align: center; margin: 14px 0;
  }
  .qr-img { width: 100%; max-width: 260px; display: block; margin: 0 auto; }
  .qr-wait { color: #57606a; font-size: 13px; padding: 40px 0; }
  .line { padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 14px; word-break: break-all; }
  .line:last-of-type { border-bottom: none; }
  .muted { color: #8b949e; }
  .ok { color: #3fb950; }
  .warn { color: #d29922; }
  .bad { color: #f85149; }
  input[type=password] {
    width: 100%; padding: 10px 12px; margin: 8px 0; border-radius: 8px;
    border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 15px;
  }
  button {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #238636;
    background: #238636; color: #fff; font-size: 15px; cursor: pointer; margin-top: 6px;
  }
  button.secondary { background: transparent; border-color: #30363d; color: #e6edf3; margin-top: 16px; }
  .err { color: #f85149; font-size: 13px; min-height: 18px; margin-top: 6px; }
  .tick { font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Mosaic</h1>
  <div class="sub">Slash commands, answered in your Me chat.</div>

  <div id="login-view" class="view">
    <div class="line muted">Setup password (printed in the deploy logs)</div>
    <input id="password" type="password" placeholder="setup password" autocomplete="current-password">
    <button id="login-btn">Open setup</button>
    <div id="login-err" class="err"></div>
  </div>

  <div id="setup-view" class="view">
    <div class="line">Link Mosaic to WhatsApp</div>
    <div class="qr-wrap">
      <img id="qr-img" class="qr-img" src="" alt="QR code" style="display:none">
      <div id="qr-wait" class="qr-wait">waiting for a QR code…</div>
    </div>
    <div class="line muted">WhatsApp → Linked devices → Link a device</div>
    <div id="gemini-setup" class="tick muted"></div>
  </div>

  <div id="connected-view" class="view">
    <div id="connected-line" class="line"></div>
    <div class="line">Me chat: <span id="mechat-line"></span></div>
    <div class="line muted">Last message there: <span id="last-line">—</span></div>
    <div class="line muted">Resolved via: <span id="how-line">—</span> · welcome sent: <span id="welcomed-line">—</span></div>
    <div id="gemini-connected" class="tick muted"></div>
    <button id="unlink-btn" class="secondary">Unlink and wipe session</button>
  </div>
</div>

<script>
(function () {
  var state = null;

  function el(id) { return document.getElementById(id); }

  function show(view) {
    ['login-view', 'setup-view', 'connected-view'].forEach(function (v) {
      el(v).classList.toggle('active', v === view);
    });
  }

  function render(d) {
    var gemini = d.gemini_key === 'valid' ? '<span class="ok">valid</span>' :
                 d.gemini_key === 'invalid' ? '<span class="bad">invalid</span>' :
                 '<span class="warn">not set</span>';
    el('gemini-setup').innerHTML = 'Gemini key: ' + gemini;
    el('gemini-connected').innerHTML = 'Gemini key: ' + gemini;

    if (!d.paired) {
      show('setup-view');
      var img = el('qr-img'), wait = el('qr-wait');
      if (d.qr_data_url) { img.src = d.qr_data_url; img.style.display = 'block'; wait.style.display = 'none'; }
      else { img.style.display = 'none'; wait.style.display = 'block'; }
      return;
    }

    show('connected-view');
    var conn = d.connected ? '<span class="ok">Connected</span>' : '<span class="warn">reconnecting…</span>';
    var phone = d.mechat_phone ? ('+' + d.mechat_phone) : 'unknown number';
    el('connected-line').innerHTML = conn + ' as ' + phone;
    var mech = d.mechat_jid ? d.mechat_jid : '<span class="bad">NOT FOUND YET</span>';
    if (d.mechat_jid && !d.welcomed) { mech += ' <span class="warn">(welcome pending)</span>'; }
    el('mechat-line').innerHTML = mech;
    el('last-line').textContent = d.last_message_at || '—';
    el('how-line').textContent = d.mechat_how || '—';
    el('welcomed-line').textContent = d.welcomed ? 'yes' : 'not yet';
  }

  function tick() {
    fetch('/setup/state').then(function (r) {
      if (r.status === 401) { show('login-view'); return; }
      if (!r.ok) { return; }
      return r.json().then(render);
    }).catch(function () {});
  }

  el('login-btn').addEventListener('click', function () {
    fetch('/setup/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: el('password').value })
    }).then(function (r) {
      if (r.ok) { el('login-err').textContent = ''; tick(); }
      else { el('login-err').textContent = 'Wrong password. Find it in the deploy logs.'; }
    }).catch(function () { el('login-err').textContent = 'Network error'; });
  });

  el('password').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { el('login-btn').click(); }
  });

  el('unlink-btn').addEventListener('click', function () {
    if (!confirm('Unlink this WhatsApp session? You will need to scan a new QR code.')) { return; }
    fetch('/setup/reset', { method: 'POST' }).then(tick);
  });

  show('login-view');
  tick();
  setInterval(tick, 2000);
})();
</script>
</body>
</html>
